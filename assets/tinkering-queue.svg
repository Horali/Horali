<svg xmlns="http://www.w3.org/2000/svg" width="960" height="100" viewBox="0 0 960 100" role="img" aria-labelledby="title desc">
  <title id="title">Currently tinkering with</title>
  <desc id="desc">A little ghost routes incoming tasks into three queue slots, which light up in sequence.</desc>
  <style>
    .ghost { animation: hover 4s ease-in-out infinite; }
    .task { animation: route 9s linear infinite; }
    .task-two { animation-delay:-3s; --slot-y:0px; }
    .task-three { animation-delay:-6s; --slot-y:20px; }
    .slot { animation: fill 9s infinite; }
    .slot-two { animation-delay:-3s; }
    .slot-three { animation-delay:-6s; }
    .scan { animation: scan 3s ease-in-out infinite; }
    @keyframes hover { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
    @keyframes route { 0% { transform:translate(0,0);opacity:0; } 8% { transform:translate(20px,0);opacity:1; } 28% { transform:translate(132px,0);opacity:1; } 38% { transform:translate(132px,0);opacity:1; } 55% { transform:translate(410px,var(--slot-y,-20px));opacity:1; } 65% { transform:translate(410px,var(--slot-y,-20px));opacity:0; } 100% { transform:translate(410px,var(--slot-y,-20px));opacity:0; } }
    @keyframes fill { 0%,50%,90%,100% { fill:#d58b54;fill-opacity:.08; } 60%,80% { fill:#ed9a51;fill-opacity:.65; } }
    @keyframes scan { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; } .task { opacity:0; } .slot { fill-opacity:.3; } }
  </style>
  <g transform="translate(15 39)">
    <path d="M-12 10V-6a12 12 0 0 1 24 0v16l-6-3-6 3-6-3Z" fill="#fff0dc" stroke="#bc835b" stroke-width="1.5"/>
    <circle cx="-4" cy="-3" r="1.5" fill="#9a5b36"/><circle cx="4" cy="-3" r="1.5" fill="#9a5b36"/>
    <path d="M-3 2q3 3 6 0" stroke="#9a5b36" fill="none" stroke-width="1.3"/>
  </g>
  <text x="41" y="49" fill="#eb9b58" font-family="Georgia,serif" font-style="italic" font-size="27">currently tinkering with</text>
  <path d="M354 56H945" stroke="#d58b54" stroke-opacity=".4" stroke-dasharray="2 7"/>
  <g transform="translate(603 43)">
    <path d="M0 0H85l52-19h69M85 0h121M85 0l52 19h69" fill="none" stroke="#c58b60" stroke-opacity=".5" stroke-dasharray="3 5"/>
    <g class="ghost">
      <ellipse cy="29" rx="20" ry="3" fill="#b36738" opacity=".15"/>
      <path d="M-20 17V-6a20 20 0 0 1 40 0v23l-7-4-6 4-7-4-7 4-6-4Z" fill="#fff0dc" stroke="#bd8258" stroke-width="1.8"/>
      <circle cx="-7" cy="-5" r="2.3" fill="#9a5b36"/><circle cx="7" cy="-5" r="2.3" fill="#9a5b36"/>
      <ellipse cx="-12" cy="2" rx="4" ry="2" fill="#eeb698"/><ellipse cx="12" cy="2" rx="4" ry="2" fill="#eeb698"/>
      <path d="M-4 2q4 5 8 0" fill="none" stroke="#9a5b36" stroke-width="1.5" stroke-linecap="round"/>
      <path class="scan" d="M-29-21h-7v42h7M29-21h7v42h-7" stroke="#db975e" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  <g transform="translate(810 15)" stroke="#d58b54" stroke-width="1.5">
    <rect class="slot" width="104" height="16" rx="5" fill="#d58b54" fill-opacity=".08"/>
    <rect class="slot slot-two" y="20" width="104" height="16" rx="5" fill="#d58b54" fill-opacity=".08"/>
    <rect class="slot slot-three" y="40" width="104" height="16" rx="5" fill="#d58b54" fill-opacity=".08"/>
    <path d="M12 8h35M12 28h54M12 48h43" stroke-opacity=".65"/>
    <path d="M85 7l3 3 5-5M85 27l3 3 5-5M85 47l3 3 5-5" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(452 43)">
    <g class="task"><rect x="-9" y="-11" width="18" height="22" rx="3" fill="#f4ab69" stroke="#a8683e" stroke-width="1.5"/><path d="M-4-4h8M-4 1h6" stroke="#9c603a"/></g>
    <g class="task task-two"><rect x="-9" y="-11" width="18" height="22" rx="3" fill="#ffe2b4" stroke="#a8683e" stroke-width="1.5"/><path d="M-4-4h8M-4 1h6" stroke="#9c603a"/></g>
    <g class="task task-three"><rect x="-9" y="-11" width="18" height="22" rx="3" fill="#e8b788" stroke="#a8683e" stroke-width="1.5"/><path d="M-4-4h8M-4 1h6" stroke="#9c603a"/></g>
  </g>
  <g fill="#c28d67" font-family="Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="1">
    <text x="452" y="88">ideas in</text><text x="603" y="88">sort &amp; schedule</text><text x="862" y="88">next up</text>
  </g>
</svg>
