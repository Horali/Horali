<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">horali — a little automation magic</title>
  <desc id="desc">Orange Halloween illustration with floating, blinking ghosts, twinkling stars, a rocking pumpkin, a typing terminal, and a looping automation queue. Motion pauses when reduced motion is preferred.</desc>
  <style>
    .float-a { animation: float 4.8s ease-in-out infinite; }
    .float-b { animation: float 4s ease-in-out -2s infinite; }
    .terminal { animation: float 7s ease-in-out -1s infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.8s ease-in-out infinite; }
    .twinkle-late { animation-delay: -1.9s; }
    .pumpkin { transform-box: fill-box; transform-origin: 50% 95%; animation: rock 5s ease-in-out infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    .typing-window { animation: type 9s steps(14, end) infinite; }
    .output { animation: output 9s infinite; }
    .status { animation: status 3s ease-in-out infinite; }
    .step-one { animation: step 6s infinite; }
    .step-two { animation: step 6s -4s infinite; }
    .step-three { animation: step 6s -2s infinite; }
    .packet { animation: packet 6s linear infinite; }
    .bat { transform-box: fill-box; transform-origin: center; animation: bat 5.5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.12); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.7) rotate(-10deg); } 50% { opacity: 1; transform: scale(1.15) rotate(10deg); } }
    @keyframes rock { 0%, 70%, 100% { transform: rotate(0deg); } 77% { transform: rotate(-7deg); } 85% { transform: rotate(6deg); } 93% { transform: rotate(-3deg); } }
    @keyframes cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes type { 0%, 8% { width: 0; } 38%, 100% { width: 190px; } }
    @keyframes output { 0%, 40% { opacity: 0; } 46%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes status { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes step { 0%, 30% { fill: #d97536; } 35%, 95% { fill: #fff0d7; } 100% { fill: #d97536; } }
    @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(228px); opacity: 0; } }
    @keyframes bat { 0%, 100% { transform: translate(0,0) rotate(-6deg); } 50% { transform: translate(-9px,-6px) rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .typing-window { width: 190px; }
      .packet { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="typing"><rect class="typing-window" x="-91" y="-33" width="190" height="29"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#b45024" opacity=".14"/>
    </pattern>
    <g id="sparkle"><path d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10Z" fill="#bc582c"/></g>
    <g id="ghost">
      <path d="M-44 21V-15a44 44 0 0 1 88 0v36l-15-9-14 9L0 12l-15 9-14-9Z" fill="#fff8e9" stroke="#773d2b" stroke-width="3" stroke-linejoin="round"/>
      <g class="eyes">
        <ellipse cx="-13" cy="-16" rx="3.5" ry="5" fill="#773d2b"/>
        <ellipse cx="13" cy="-16" rx="3.5" ry="5" fill="#773d2b"/>
      </g>
      <path d="M-5-3q5 7 10 0" fill="none" stroke="#773d2b" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-24" cy="-5" rx="7" ry="4" fill="#f6b49b"/>
      <ellipse cx="24" cy="-5" rx="7" ry="4" fill="#f6b49b"/>
    </g>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#ffce9b"/>
  <rect width="1200" height="360" rx="24" fill="url(#dots)"/>
  <path d="M777 0h399q24 0 24 24v312q0 24-24 24H777q-79-180 0-360" fill="#f4a366"/>
  <rect x="16" y="16" width="1168" height="328" rx="14" fill="none" stroke="#b85d32" stroke-opacity=".3"/>
  <g fill="#773d2b" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2">
    <text x="65" y="67">WELCOME TO MY LITTLE CORNER</text>
  </g>
  <text x="59" y="205" fill="#773d2b" font-family="'Trebuchet MS', 'Arial Rounded MT Bold', sans-serif" font-size="116" font-weight="700" letter-spacing="-6">horali<tspan fill="#d66b34">.</tspan></text>
  <text x="66" y="248" fill="#8c4a31" font-family="'Trebuchet MS', sans-serif" font-size="23">a little automation magic</text>
  <rect x="66" y="282" width="151" height="28" rx="14" fill="#fff0d7"/>
  <circle class="status" cx="82" cy="296" r="3" fill="#bd632e"/>
  <text x="94" y="300" fill="#8c4a31" font-family="Consolas, monospace" font-size="11">spooky season</text>
  <g class="twinkle"><use href="#sparkle" x="628" y="111"/></g>
  <g class="twinkle twinkle-late"><use href="#sparkle" x="570" y="282" transform="rotate(12 570 282)"/></g>
  <g transform="translate(267 282)" font-family="Consolas, monospace" font-size="10" text-anchor="middle" fill="#773d2b">
    <path d="M33 14H204" fill="none" stroke="#bb6a3f" stroke-dasharray="3 4" opacity=".6"/>
    <rect class="step-one" width="62" height="28" rx="14" fill="#fff0d7"/>
    <rect class="step-two" x="82" width="62" height="28" rx="14" fill="#fff0d7"/>
    <rect class="step-three" x="164" width="62" height="28" rx="14" fill="#fff0d7"/>
    <text x="31" y="18">queue</text><text x="113" y="18">run</text><text x="195" y="18">done ✓</text>
    <circle class="packet" cx="0" cy="35" r="2.5" fill="#bd632e"/>
  </g>
  <circle cx="670" cy="227" r="3" fill="#bd632e"/>
  <circle cx="539" cy="81" r="2" fill="#bd632e"/>
  <g class="terminal"><g transform="translate(917 208) rotate(-4)">
    <rect x="-111" y="-76" width="222" height="147" rx="13" fill="#773d2b" opacity=".12" transform="translate(0 8)"/>
    <rect x="-111" y="-76" width="222" height="147" rx="13" fill="#fff3dd" stroke="#773d2b" stroke-width="3"/>
    <path d="M-109-43H109" stroke="#773d2b" stroke-width="2"/>
    <circle cx="-94" cy="-59" r="4" fill="#df8450"/>
    <circle cx="-80" cy="-59" r="4" fill="#edbd7c"/>
    <circle cx="-66" cy="-59" r="4" fill="#c3b276"/>
    <g font-family="Consolas, monospace" font-size="17" fill="#773d2b">
      <text clip-path="url(#typing)" x="-87" y="-13"><tspan fill="#c86635">$</tspan> run magic.py</text>
      <g class="output">
      <text x="-87" y="20" font-size="13" fill="#ac6848">less clicking,</text>
      <text x="-87" y="41" font-size="13" fill="#ac6848">more creating.</text>
      </g>
    </g>
    <rect class="cursor" x="48" y="30" width="8" height="14" rx="1" fill="#d67b44"/>
  </g></g>
  <g class="float-a"><use href="#ghost" transform="translate(1039 112) rotate(13) scale(.9)"/></g>
  <g class="float-b"><use href="#ghost" transform="translate(786 241) rotate(-13) scale(.67)"/></g>
  <g transform="translate(1070 284)"><g class="pumpkin">
    <path d="M-3-35q-8-19 5-24" fill="none" stroke="#71804a" stroke-width="8" stroke-linecap="round"/>
    <path d="M3-43q12-17 27-8Q20-35 3-43" fill="#8c9c5f"/>
    <ellipse cx="-21" cy="0" rx="26" ry="31" fill="#d97536" stroke="#773d2b" stroke-width="2.5"/>
    <ellipse cx="21" cy="0" rx="26" ry="31" fill="#d97536" stroke="#773d2b" stroke-width="2.5"/>
    <ellipse cy="0" rx="28" ry="34" fill="#ef9449" stroke="#773d2b" stroke-width="2.5"/>
    <path d="M-21-7l10-6 2 11Z M21-7l-10-6-2 11Z" fill="#773d2b"/>
    <path d="M-12 11q12 13 24 0" fill="none" stroke="#773d2b" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-24" cy="6" rx="6" ry="3" fill="#f6b49b"/>
    <ellipse cx="24" cy="6" rx="6" ry="3" fill="#f6b49b"/>
  </g></g>
  <g class="twinkle twinkle-late"><use href="#sparkle" x="1124" y="188"/></g>
  <g class="twinkle"><use href="#sparkle" transform="translate(810 83) scale(.7)"/></g>
  <g transform="translate(1104 66)"><g class="bat">
    <path d="M-4 0l-3-8 7 4 7-4-3 8q15-13 27-2-10-1-9 10-9-4-15 3L0 8l-7 3q-6-7-15-3 1-11-9-10Q-19-13-4 0Z" fill="#995434"/>
    <circle cx="-2" cy="2" r="1" fill="#ffe5bf"/><circle cx="2" cy="2" r="1" fill="#ffe5bf"/>
  </g></g>
  <circle cx="1144" cy="111" r="3" fill="#bc582c"/>
  <path d="M907 54q-12 15 7 23-25 2-24-17 2-9 17-6" fill="#fff3dd"/>
</svg>
