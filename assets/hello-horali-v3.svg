<svg xmlns="http://www.w3.org/2000/svg" width="960" height="174" viewBox="0 0 960 174" role="img" aria-labelledby="title desc">
  <title id="title">hi, i'm Horali!</title>
  <desc id="desc">Orange and peach lettering with a hand-drawn underline and little stars. A Software Engineering undergraduate at Institut Teknologi Sepuluh Nopember.</desc>
  <style>
    .hello { fill: #f4c09a; }
    .note { fill: #cf9e7e; }
    .flourish { stroke-dasharray: 440; animation: draw 1.8s ease-out both; }
    .star { transform-box: fill-box; transform-origin: center; animation: sparkle 4s ease-in-out infinite; }
    @keyframes draw { from { stroke-dashoffset: 440; } to { stroke-dashoffset: 0; } }
    @keyframes sparkle { 0%,100% { opacity: .6; transform: rotate(-8deg) scale(.9); } 50% { opacity: 1; transform: rotate(8deg) scale(1.1); } }
    @media (prefers-color-scheme: light) { .hello { fill: #9a532e; } .note { fill: #8c654f; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g text-anchor="middle">
    <text x="480" y="36" fill="#d89056" font-family="Consolas, monospace" font-size="11" letter-spacing="4">THE PERSON BEHIND THE SCRIPTS</text>
    <text x="477" y="102" font-size="56"><tspan class="hello" font-family="Georgia, serif" font-style="italic">hi, i'm </tspan><tspan fill="#f29b55" font-family="'Trebuchet MS', sans-serif" font-weight="700" letter-spacing="-2">Horali!</tspan></text>
    <text class="note" x="480" y="157" font-family="'Trebuchet MS', sans-serif" font-size="18">a Software Engineering undergraduate at Institut Teknologi Sepuluh Nopember.</text>
  </g>
  <path class="flourish" d="M401 115q97-13 194-3m-176 12q83-9 158-4" stroke="#e88c45" stroke-width="3" stroke-linecap="round" fill="none"/>
  <g class="star"><path d="M251 67q2 12 14 14-12 2-14 14-2-12-14-14 12-2 14-14" fill="#f29b55"/></g>
  <g class="star" style="animation-delay:-2s"><path d="M704 81q1 8 9 9-8 1-9 9-1-8-9-9 8-1 9-9" fill="#f4c09a"/></g>
  <circle cx="725" cy="66" r="2.5" fill="#d89056"/>
  <circle cx="226" cy="105" r="2" fill="#d89056"/>
</svg>
